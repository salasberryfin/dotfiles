# switch default Ctrl+b prefix to Ctrl+a
unbind C-b
set -g prefix C-a

# keep colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# bind tmux configuration reload to r
unbind r
bind r source-file $HOME/.tmux.conf \; display "Tmux configuration ${HOME}/.tmux.conf reloaded"

# unbind vertical and horizontal split and set to | -, respectively
unbind %
unbind "'"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim motions for window navigation: Ctrl+[hl]
bind h previous-window 
bind l next-window

# set window to 1-indexing
set -g base-index 1
set-window-option -g pane-base-index 1

# increase the history limit: useful when reading logs
set -g history-limit 100000

# set vim motions as default
set-window-option -g mode-keys vi

# configure copy mode to use vim defaults
unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

## COLORS ## (gruvbox-material, dark medium)

# pane border
set -g pane-border-style fg="#45403d"
set -g pane-active-border-style fg="#a89984"

# status line
set -g status-style bg="#32302f",fg="#d4be98"
set -g status-interval 1

# message and copy-mode selection
set -g message-style bg="#45403d",fg="#d4be98"
set -g mode-style bg="#45403d",fg="#d4be98"

# window status
set-window-option -g window-status-style fg="#928374",bg=default
set-window-option -g window-status-current-style fg="#d8a657",bg="#45403d"

# hide status-right
set -g status-right-length 100
set -g status-right '#(pwd)'

