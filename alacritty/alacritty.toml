[env]
# this forces alacritty to use standard scaling
# it fixes auto-scaling font issues which make the characters massive on high
# resolution displays.
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
decorations = "None"
dynamic_title = true
startup_mode = "Windowed"
# not working with my i3 configuration, may look at this at some point in the future.
# opacity = 0.93

[scrolling]
history = 10000

[font]
# Iosevka is narrow, so it needs a slightly larger size than JetBrains Mono
size = 13

[font.normal]
family = "Iosevka Term"
style = "Regular"

[font.bold]
family = "Iosevka Term"
style = "Bold"

[font.italic]
family = "Iosevka Term"
style = "Italic"

[font.bold_italic]
family = "Iosevka Term"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 500
thickness = 0.15

[colors]
# gruvbox-material (dark, medium)
[colors.primary]
background = "#282828"
foreground = "#d4be98"

[colors.cursor]
text = "#282828"
cursor = "#d4be98"

[colors.selection]
text = "CellForeground"
background = "#45403d"

[colors.normal]
black =   "#3c3836"
red =     "#ea6962"
green =   "#a9b665"
yellow =  "#d8a657"
blue =    "#7daea3"
magenta = "#d3869b"
cyan =    "#89b482"
white =   "#d4be98"

[colors.bright]
black =   "#7c6f64"
red =     "#ea6962"
green =   "#a9b665"
yellow =  "#d8a657"
blue =    "#7daea3"
magenta = "#d3869b"
cyan =    "#89b482"
white =   "#ddc7a1"

[terminal.shell]
program = "/usr/bin/fish"

[selection]
save_to_clipboard = false
