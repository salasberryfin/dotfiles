[env]
# this forces alacritty to use standard scaling
# it fixes auto-scaling font issues which make the characters massive on high
# resolution displays.
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
decorations = "None"
dynamic_title = true
startup_mode = "Windowed"
# not working with my i3 configuration, may look at this at some point in the future.
# opacity = 0.93

[scrolling]
history = 10000

[font]
# Iosevka is narrow, so it needs a slightly larger size than JetBrains Mono
size = 13

[font.normal]
family = "Iosevka Term"
style = "Regular"

[font.bold]
family = "Iosevka Term"
style = "Bold"

[font.italic]
family = "Iosevka Term"
style = "Italic"

[font.bold_italic]
family = "Iosevka Term"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 500
thickness = 0.15

[colors]
# everforest (dark, medium)
[colors.primary]
background = "#2d353b"
foreground = "#d3c6aa"

[colors.cursor]
text = "#2d353b"
cursor = "#d3c6aa"

[colors.selection]
text = "CellForeground"
background = "#475258"

[colors.normal]
black =   "#475258"
red =     "#e67e80"
green =   "#a7c080"
yellow =  "#dbbc7f"
blue =    "#7fbbb3"
magenta = "#d699b6"
cyan =    "#83c092"
white =   "#d3c6aa"

[colors.bright]
black =   "#7a8478"
red =     "#e67e80"
green =   "#a7c080"
yellow =  "#dbbc7f"
blue =    "#7fbbb3"
magenta = "#d699b6"
cyan =    "#83c092"
white =   "#d3c6aa"

[terminal.shell]
program = "/usr/bin/fish"

[selection]
save_to_clipboard = false
